<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="MotoRoute" />
  <meta name="theme-color" content="#0f0f0f" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <title>MotoRoute</title>
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="logo">Moto<span>Route</span></div>
      <div class="topbar-actions">
        <button class="icon-btn" id="btn-import" title="Importa GPX" aria-label="Importa GPX">📥</button>
        <button class="icon-btn" id="btn-library" title="Percorsi salvati" aria-label="Percorsi salvati">★</button>
      </div>
    </header>
    <input type="file" id="gpx-input" accept=".gpx,application/gpx+xml" hidden />
    <div id="map" aria-label="Mappa del percorso"></div>
    <div class="sheet" id="sheet">
      <button class="sheet-grip" id="sheet-grip" aria-label="Mostra o nascondi il pannello" aria-expanded="true">
        <span class="grip-bar"></span>
        <span class="grip-peek" id="grip-peek">Tocca per aprire il pannello</span>
      </button>
      <div class="sheet-body" id="sheet-body">
        <div class="mode-toggle" id="mode-toggle">
          <button type="button" data-mode="manuale" class="active">✏️ Manuale</button>
          <button type="button" data-mode="anello">🔁 Anello</button>
        </div>
        <div class="anello-controls" id="anello-controls" hidden>
          <div class="anello-dist">
            <span class="anello-dist-val" id="anello-dist-val">150 km</span>
            <input type="range" id="anello-dist" min="30" max="400" step="10" value="150" aria-label="Distanza anello" />
          </div>
          <div class="compass" id="compass" role="group" aria-label="Direzione">
            <button type="button" data-dir="NO">NO</button>
            <button type="button" data-dir="N">N</button>
            <button type="button" data-dir="NE">NE</button>
            <button type="button" data-dir="O">O</button>
            <button type="button" data-dir="rand" class="rand active">✦</button>
            <button type="button" data-dir="E">E</button>
            <button type="button" data-dir="SO">SO</button>
            <button type="button" data-dir="S">S</button>
            <button type="button" data-dir="SE">SE</button>
          </div>
          <div class="anello-actions">
            <button class="btn btn-amber" id="btn-anello-gen">🔁 Genera anello</button>
            <button class="btn btn-ghost" id="btn-anello-surprise">✦ Sorprendimi</button>
          </div>
          <p class="anello-hint" id="anello-hint">Tocca la mappa (o usa il GPS) per il punto di partenza.</p>
        </div>
        <p class="hint" id="hint">Tocca la mappa per la partenza, poi la destinazione. Ogni tocco aggiunge una tappa; trascina i punti per correggere.</p>
        <div class="wp-list" id="wp-list" hidden></div>
        <div class="route-opts" id="route-opts" hidden>
          <label class="opt-toggle"><input type="checkbox" id="opt-avoid-hw" /> <span>🛣️ Evita autostrade e superstrade</span></label>
          <div class="seg" id="opt-pref" role="group" aria-label="Tipo di percorso">
            <button type="button" data-pref="recommended" class="active">Consigliato</button>
            <button type="button" data-pref="fastest">Veloce</button>
          </div>
        </div>
        <div class="route-summary" id="route-summary" hidden>
          <div class="rs-metric"><span class="rs-val" id="rs-km">—</span><span class="rs-unit">km</span></div>
          <div class="rs-sep"></div>
          <div class="rs-metric"><span class="rs-val" id="rs-time">—</span><span class="rs-unit">tempo di guida</span></div>
        </div>
        <div class="export-row" id="export-row" hidden>
          <button class="btn btn-outline" id="btn-save">★ Salva</button>
          <button class="btn btn-outline" id="btn-gpx">⬇ GPX</button>
          <button class="btn btn-outline" id="btn-share">⤴ Condividi</button>
          <button class="btn btn-blue" id="btn-maps">🗺 Maps</button>
        </div>
        <p class="err" id="err" hidden></p>
        <div class="actions" id="actions" hidden>
          <button class="btn btn-ghost" id="btn-gps">◎ La mia posizione</button>
          <button class="btn btn-ghost" id="btn-clear">Pulisci</button>
        </div>
      </div>
    </div>
  </div>
  <div class="overlay" id="library" hidden>
    <div class="overlay-head">
      <span class="overlay-title">Percorsi salvati</span>
      <button class="icon-btn" id="btn-lib-close" aria-label="Chiudi">✕</button>
    </div>
    <div class="lib-list" id="lib-list"></div>
  </div>
  <div class="toast" id="toast"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
